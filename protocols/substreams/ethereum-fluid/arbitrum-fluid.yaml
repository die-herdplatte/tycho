binaries:
  default:
    file: ../target/wasm32-unknown-unknown/release/ethereum_fluid_v1.wasm
    type: wasm/rust-v1
modules:
  - name: map_dex_deployed
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  - name: store_contract_addresses
    kind: store
    inputs:
      - map: map_dex_deployed
    updatePolicy: set
    valueType: string

  - name: store_components
    kind: store
    inputs:
      - map: map_dex_deployed
    updatePolicy: set
    valueType: bytes

  - name: map_initialized_components
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_components
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  - name: store_initialized_components
    kind: store
    inputs:
      - map: map_initialized_components
    updatePolicy: set
    valueType: int64

  - name: map_protocol_changes
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_initialized_components
      - store: store_components
      - store: store_initialized_components
      - store: store_contract_addresses
    output:
      type: proto:tycho.evm.v1.BlockChanges
network: arbitrum
package:
  name: arbitrum_fluid_v1
  version: v0.4.0
protobuf:
  files:
    - tycho/evm/v1/vm.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto
specVersion: v0.1.0
